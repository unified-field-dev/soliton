[workspace]
resolver = "2"
members = ["soliton"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Deny undocumented public items. Only crates that opt in with `[lints]\nworkspace = true`
# inherit this; unlisted workspace members are unaffected until they opt in too.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[workspace.dependencies]
anyhow = "1"
axum = "0.8.4"
chrono = { version = "0.4", features = ["clock"] }
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.5"
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1"

